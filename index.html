<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XKOD Leads</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="shortcut icon" href="imagenes/logo.png" type="image/x-icon">
</head>
<body>
  <!-- ENCABEZADO -->
  <header class="header">
    <p>Gestión de prospectos — XKOD</p>
    <!-- Logo de la empresa -->
  </header>

  <main class="container">

    <!-- FORMULARIO DE CAPTURA -->
    <section class="panel">
      <h1>XKOD</h1>
      <br>
      <h3>Nuevos prospectos</h3>
      <hr>
      <form id="lead-form" class="lead-form">
        <div class="container">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Nombre Completo" required />
          <br>
          <br>
          <label for="empresa">Empresa</label>
          <input type="text" id="empresa" name="empresa" placeholder="Nombre de la Empresa" required />
          <br>
          <br>
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="correo@empresa.com" required />
          <br>
          <br>
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" placeholder="5555555555" required />
          <br>
          <br>
          <label for="status">Estado</label>
          <select id="status" required>
            <option value="null" selected>Seleccione</option>
            <option value="pendiente">Pendiente</option>
            <option value="contactado">Contactado</option>
            <option value="negociacion">En Negociación</option>
          </select>
          <br>
          <hr>
          <button type="button" onclick="guardar()"><img src="imagenes/Emoticons (4).png" alt="save" width="50px" height="50px"></button>
        </div>
        <div class="container-buscador">
          <h2>Buscador</h2>
          <hr>
          <label for="buscador"></label>
          <input type="text" id="buscador" placeholder="Buscar por ID o Nombre">
          <button type="button" onclick="buscar()"><img src="imagenes/Emoticons (3).png" alt="search" width="50px" height="50px"></button>
        </div>
      </form>
    </section>
    <hr>
    <!-- TABLA-->
    <section class="panel">
      <h2>Tabla</h2>

      <div class="tabla">
        <div class="table-scroll">
          <table class="leads-tabla">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Empresa</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tablaDatos"></tbody>
          </table>
        </div>
        <!--<button type="button" onclick="exportarCSV()">Exportar CSV<img src="imagenes/Emoticons (5).png" alt="search" width="50px" height="50px"></button>-->
      </div>
    </section>
  </main>
  <script src="script/script.js" defer></script>
</body>
</html>
