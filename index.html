<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XKOD Leds</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="header">
    <div class="header__logo">
      <span class="logo-mark">XK</span>
      <span class="logo-text">LEDS</span>
    </div>
    <p>Gestión de prospectos — XKOD</p>
  </header>

  <main class="container">

    <!-- FORMULARIO DE CAPTURA -->
    <section class="panel">
      <form id="lead-form" class="lead-form" novalidate>

        <div class="form-row">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre Completo" required />
          </div>
          <div class="form-group">
            <label for="empresa">Empresa</label>
            <input type="text" id="empresa" name="empresa" placeholder="Nombre de la Empresa" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="correo@empresa.com" required />
          </div>
          <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" placeholder="5555555555" required />
          </div>
        </div>

        <div class="form-group">
          <label for="status">Estado</label>
          <select id="status" name="status">
            <option value="null" selected>Seleccione</option>
            <option value="Pendiente">Pendiente</option>
            <option value="Contactado">Contactado</option>
            <option value="En Negociación">En Negociación</option>
          </select>
        </div>
        <button onclick="guardar()">Guardar Prospecto</button>

      </form>
    </section>

    <!-- TABLA-->
    <section class="panel">
      <h2>Tabla</h2>

      <div class="table-scroll">
        <table class="leads-table">
          <thead>
            <tr>
            </tr>
          </thead>
          <tbody id="leads-tbody">
            <!-- Semana 2 -->
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
