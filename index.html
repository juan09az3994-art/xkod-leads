<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XKOD Leads</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="shortcut icon" href="imagenes/logo.png" type="image/x-icon">
</head>
<body>
  <!-- ENCABEZADO -->
  <header class="header">
    <p>Gestión de prospectos — XKOD</p>
    <!-- Logo de la empresa -->
  </header>

  <main class="container">

    <!-- FORMULARIO DE CAPTURA -->
    <section class="panel">
      <h1>XKOD</h1>
      <br>
      <h3>Nuevos prospectos</h3>
      <hr>
      <form id="lead-form" class="lead-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="nombre"><b>Nombre</b></label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre Completo" required />
          </div>
          <div class="form-group">
            <label for="empresa"><b>Empresa</b></label>
            <input type="text" id="empresa" name="empresa" placeholder="Nombre de la Empresa" required />
          </div>
          <div class="form-group">
            <label for="email"><b>Email</b></label>
            <input type="email" id="email" name="email" placeholder="correo@empresa.com" required />
          </div>
          <div class="form-group">
            <label for="telefono"><b>Teléfono</b></label>
            <input type="tel" id="telefono" name="telefono" placeholder="5555555555" required />
          </div>
          <div class="form-group">
            <label for="status"><b>Estado</b></label>
            <select id="status" required>
              <option value="null" selected><b>----</b></option>
              <option value="pendiente"><b>Pendiente</b></option>
              <option value="contactado"><b>Contactado</b></option>
              <option value="negociacion"><b>En Negociación</b></option>
            </select>
          </div>
        </div>
        <hr>
        <div class="form-actions">
          <button type="button" onclick="guardar()"><img src="imagenes/Emoticons (4).png" alt="save" width="50px" height="50px"></button>
        </div>
        <div class="container-buscador">
          <h2>Buscador</h2>
          <div class="buscador-row">
            <br>
            <hr>
            <label for="buscador" class="buscador-label"></label>
            <input type="text" id="buscador" placeholder="Buscar por ID o Nombre">
            <div class="form-actions buscador-actions">
              <button type="button" onclick="buscar()"><img src="imagenes/Emoticons (3).png" alt="search" width="50px" height="50px"></button>
              <button type="button" onclick="limpiarBusqueda()"><img src="imagenes/Emoticons (6).png" alt="clear" width="50px" height="50px"></button>
            </div>
          </div>
        </div>
      </form>
    </section>
    <hr>
    <!-- TABLA-->
    <section class="panel">
      <h2>Tabla</h2>
      <button type="button" onclick="exportarCSV()"><img src="imagenes/Emoticons (5).png" alt="Exportar a CSV" width="50px" height="50px"></button>
      <!-- <button type="button" onclick="descargarpdf()">Descargar PDF<img src="imagenes/Emoticons (5).png" alt="Descargar PDF" width="50px" height="50px"></button> -->


      <div class="tabla">
        <div class="table-scroll">
          <table class="leads-tabla">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Empresa</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tablaDatos"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script src="script/script.js" defer></script>
</body>
</html>
