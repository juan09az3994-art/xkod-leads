<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XKOD Leads</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="header">
      <span class="logo-mark">XK</span>
      <span class="logo-text">LEADS</span>
    </div>
    <p>Gestión de prospectos — XKOD</p>
  </header>

  <main class="container">

    <!-- FORMULARIO DE CAPTURA -->
    <section class="panel">
      <form id="lead-form" class="lead-form" novalidate>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre Completo" required />
        <br>
        <br>
        <label for="empresa">Empresa</label>
        <input type="text" id="empresa" name="empresa" placeholder="Nombre de la Empresa" required />
        <br>
        <br>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="correo@empresa.com" required />
        <br>
        <br>
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="5555555555" required />
        <br>
        <br>
        <label for="status">Estado</label>
        <select id="status" name="status">
          <option value="null" selected>Seleccione</option>
          <option value="Pendiente">Pendiente</option>
          <option value="Contactado">Contactado</option>
          <option value="En Negociación">En Negociación</option>
        </select>
        <br>
        <hr>
        <button onclick="guardar()">Guardar</button>

      </form>
    </section>
    <hr>
    <!-- TABLA-->
    <section class="panel">
      <h2>Tabla</h2>

      <div class="table-scroll">
        <table class="leads-table" border="1">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Empresa</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tablaDatos"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
